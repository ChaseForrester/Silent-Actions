<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — Silent Actions</title>
  <meta name="description"
    content="Shop Silent Actions: organic hoodies, linen, hemp jackets, loungewear and the Quiet Hour journal. Afterpay and Zip Pay available.">
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="shop">
  <div class="grain"></div>
  <div data-header></div>

  <section class="shop-hero">
    <div class="container">
      <span class="eyebrow">The collection · Be better Do better</span>
      <h1 style="font-size:clamp(3rem,8vw,6rem);font-style:italic;margin:8px 0 12px">Wear the practice.</h1>
      <p class="lede">Ten garments. Regenerative fibres. Cut for comfort of body and mind. Split any order with Afterpay
        or Zip Pay.</p>
      <div class="filters" role="tablist">
        <button class="filter-btn" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" data-filter="wear" aria-pressed="false">Wear</button>
        <button class="filter-btn" data-filter="rest" aria-pressed="false">Rest</button>
      </div>
      <div class="product-grid" data-product-grid></div>
    </div>
  </section>

  <section class="section" style="padding-top:24px">
    <div class="container" style="border-top:1px solid var(--sa-line);padding-top:40px">
      <p class="eyebrow">How to pay</p>
      <h2 style="margin:8px 0 16px">Afterpay and Zip Pay on every piece.</h2>
      <div class="pay-row">
        <span class="pay-logos">
          <img src="images/pay/afterpay.png" alt="Afterpay">
          <img src="images/pay/zip-pay.png" alt="Zip Pay">
        </span>
        <span class="pay-note">Four interest-free payments. Choose at checkout.</span>
      </div>
    </div>
  </section>

  <div data-footer></div>
  <script src="js/app.js"></script>
</body>

</html>
