<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — Silent Actions</title>
  <meta name="description"
    content="Shop Silent Actions men's, women's and unisex t-shirts, polos, singlets, crew necks and hoodies. Afterpay and Zip Pay.">
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="shop">
  <div class="grain"></div>
  <div data-header></div>

  <section class="shop-hero">
    <div class="container shop-layout">
      <aside class="shop-sidebar" data-shop-nav></aside>
      <div>
        <span class="eyebrow">Shop · Be better Do better</span>
        <h1 data-shop-title style="font-size:clamp(2.6rem,6vw,5rem);font-style:italic;margin:8px 0 12px">The collection
        </h1>
        <p class="lede" data-shop-lede>T-shirts, polos, singlets, crews and hoodies. Motocross, gym and street. Afterpay
          and Zip Pay.</p>
        <div class="filters" role="tablist">
          <button class="filter-btn" data-filter="all" aria-pressed="true">All lanes</button>
          <button class="filter-btn" data-filter="mx" aria-pressed="false">Motocross</button>
          <button class="filter-btn" data-filter="gym" aria-pressed="false">Gym</button>
          <button class="filter-btn" data-filter="street" aria-pressed="false">Street</button>
        </div>
        <div class="product-grid" data-product-grid></div>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:24px">
    <div class="container" style="border-top:1px solid var(--sa-line);padding-top:40px">
      <p class="eyebrow">How to pay</p>
      <h2 style="margin:8px 0 16px">Afterpay and Zip Pay on every piece.</h2>
      <div class="pay-row">
        <span class="pay-logos">
          <img src="images/pay/afterpay.png" alt="Afterpay">
          <img src="images/pay/zip-pay.png" alt="Zip Pay">
        </span>
        <span class="pay-note">Four interest-free payments. Choose at checkout.</span>
      </div>
      <p class="eyebrow" style="margin-top:36px">Certified</p>
      <div class="cert-logos" style="margin-top:16px">
        <img src="images/certs/fairtrade.png" alt="Fairtrade">
        <img src="images/certs/bcorp.png" alt="Certified B Corporation">
        <img src="images/certs/social-traders.png" alt="Social Traders Certified Social Enterprise">
      </div>
    </div>
  </section>

  <div data-footer></div>
  <script src="js/app.js"></script>
</body>

</html>
