  <script>
    (function () {
      var BUILD = "sa-video-1";
      fetch("/version.json", { cache: "no-store", credentials: "same-origin" }).then(function (res) {
        return res.ok ? res.json() : null;
      }).then(function (data) {
        if (!data || (data.site === "video" && data.build === BUILD)) return;
        var next = data.build || BUILD;
        var key = "sa-bust-" + next;
        try {
          if (sessionStorage.getItem(key) === "1") return;
          sessionStorage.setItem(key, "1");
        } catch (err) { return; }
        var url = new URL(location.href);
        url.searchParams.set("sa", next);
        location.replace(url.toString());
      }).catch(function () { });
    })();
  </script>
